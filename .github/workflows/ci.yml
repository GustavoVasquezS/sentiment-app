name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un solo workflow con tres jobs (api, ml, web) corriendo en paralelo, en
# vez de un pipeline por paquete — proporcional al tamaño del proyecto (ver
# plan de reconstrucción, sección 6).
jobs:
  api:
    name: api (lint · typecheck · test · build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sentiment_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentiment_test
      JWT_SECRET: ci-only-dummy-secret-not-for-prod-use
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate -w apps/api

      - name: Prisma migrate deploy
        run: npm run prisma:deploy -w apps/api

      - name: Lint
        run: npm run lint -w apps/api

      - name: Typecheck (src)
        run: npm run typecheck -w apps/api

      - name: Typecheck (test)
        run: npm run typecheck:test -w apps/api

      - name: Unit tests
        run: npm run test:unit -w apps/api

      - name: Integration tests
        run: npm run test:integration -w apps/api

      - name: Build
        run: npm run build -w apps/api

  ml:
    name: ml (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ml/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Pytest
        run: pytest -v

  web:
    name: web (lint · typecheck · build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint -w apps/web

      - name: Typecheck
        run: npm run typecheck -w apps/web

      - name: Build
        run: npm run build -w apps/web
